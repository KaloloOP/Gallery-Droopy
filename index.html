<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Droopy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111111;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 25px 8%;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #292929;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #eeeeee;
      color: #111111;
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: bold;
    }

    header h2 {
      font-size: 19px;
    }

    header p {
      color: #999999;
      font-size: 12px;
      margin-top: 5px;
    }

    main {
      max-width: 900px;
      margin: 90px auto;
      padding: 20px;
      text-align: center;
    }

    .tag {
      color: #aaaaaa;
      letter-spacing: 3px;
      font-size: 11px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 65px);
      margin: 20px 0;
    }

    .description {
      color: #999999;
      line-height: 1.8;
      max-width: 500px;
      margin: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 55px;
    }

    .item {
      height: 170px;
      border-radius: 15px;
      background: linear-gradient(135deg, #333333, #171717);
      border: 1px solid #333333;
      display: grid;
      place-items: center;
      color: #888888;
    }

    footer {
      text-align: center;
      color: #666666;
      padding: 35px 15px;
      font-size: 12px;
    }

    @media(max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      main {
        margin-top: 55px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GD</div>
    <div>
      <h2>Gallery Droopy</h2>
      <p>Powered by Kalolo OP</p>
    </div>
  </header>

  <main>
    <p class="tag">WELCOME TO</p>
    <h1>Gallery Droopy.</h1>
    <p class="description">
      A personal digital space.
      Simple, elegant, and made by Kalolo OP.
    </p>

    <section class="gallery">
      <div class="item">Gallery 01</div>
      <div class="item">Gallery 02</div>
      <div class="item">Gallery 03</div>
    </section>
  </main>

  <footer>
    © 2026 Gallery Droopy · Powered by Kalolo OP
  </footer>

</body>
</html>
